<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Control de la Garra</title>
<style>
  :root { --oro:#e0a82e; --oro2:#f7cf5a; --negro:#141414; --blanco:#fffdf6;
          --crema:#f1e9d2; --verde:#2fbf5b; --t:clamp(52px, 8vw, 72px); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;
      -webkit-user-select:none; touch-action:manipulation; -webkit-touch-callout:none; }
  body { margin:0; min-height:100vh; background:var(--crema); color:var(--negro);
         font-family:"Trebuchet MS", system-ui, Arial, sans-serif;
         display:flex; flex-direction:column; align-items:center; gap:18px;
         padding:max(14px, env(safe-area-inset-top)) 14px max(18px, env(safe-area-inset-bottom)); }
  h1 { margin:0; font-size:clamp(17px, 4.6vw, 26px); letter-spacing:3px; text-align:center; }
  h1 span { color:var(--oro); -webkit-text-stroke:1px var(--negro); }

  /* ---------- Pantalla con la garra ---------- */
  .vista { width:min(100%, 520px); }
  .pantalla { background:#fbf5e3; border:4px solid var(--negro); border-radius:22px;
              box-shadow:0 8px 0 var(--oro), 0 8px 0 4px var(--negro); overflow:hidden; }
  .pantalla svg { display:block; width:100%; height:auto; }
  .datos { display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin-top:16px;
           font-size:11px; font-weight:800; }
  .datos span { background:var(--blanco); border:2px solid var(--negro); border-radius:999px;
                padding:2px 9px; }

  /* ---------- Control ---------- */
  .control { position:relative; width:min(100%, 760px); margin-top:8px; }
  .cuerpo { background:linear-gradient(#f9d768, #dfa826); border:4px solid var(--negro);
            border-radius:70px; padding:44px 26px 26px;
            display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
            justify-items:center; gap:10px;
            box-shadow:0 14px 0 var(--blanco), 0 14px 0 4px var(--negro),
                       12px 24px 0 4px rgba(0,0,0,.18); }
  .izq { grid-area:1/1; } .centro { grid-area:1/2; } .der { grid-area:1/3; }

  .tecla { font-family:inherit; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.55);
           transition:transform .06s, box-shadow .06s, filter .06s; }
  .tecla.activo { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.55); filter:brightness(1.2); }
  .tecla:disabled { opacity:.45; cursor:not-allowed; }

  /* Gatillos */
  .gatillo { position:absolute; top:-14px; width:27%; height:42px; z-index:2;
             background:var(--negro); color:var(--oro2); border:3px solid var(--negro);
             border-radius:16px; font-weight:900; letter-spacing:1px;
             font-size:clamp(11px, 2.8vw, 15px); }
  .gatillo.l { left:8%; } .gatillo.r { right:8%; }

  .etq { display:block; text-align:center; font-size:10px; font-weight:800;
         letter-spacing:1.5px; margin-top:12px; }

  .aro { background:var(--blanco); border:4px solid var(--negro); border-radius:50%;
         padding:calc(var(--t) * .22); box-shadow:inset 0 0 0 3px #e9dfc0; }

  /* Cruceta */
  .cruz { display:grid; grid-template-columns:repeat(3, var(--t)); grid-template-rows:repeat(3, var(--t)); }
  .cruz .tecla { background:var(--negro); color:var(--oro2); border:0; padding:0;
                 font-size:calc(var(--t) * .42); box-shadow:none; }
  .cruz .tecla.activo { background:#3b3b3b; transform:none; filter:none; }
  .cruz .u { grid-area:1/2; border-radius:12px 12px 3px 3px; }
  .cruz .l { grid-area:2/1; border-radius:12px 3px 3px 12px; }
  .cruz .r { grid-area:2/3; border-radius:3px 12px 12px 3px; }
  .cruz .d { grid-area:3/2; border-radius:3px 3px 12px 12px; }
  .cruz .mid { grid-area:2/2; background:var(--negro); }

  /* Rombo */
  .rombo { display:grid; grid-template-columns:repeat(3, var(--t)); grid-template-rows:repeat(3, var(--t));
           place-items:center; }
  .rombo .tecla { width:calc(var(--t) * .92); height:calc(var(--t) * .92); border-radius:50%;
                  border:3px solid var(--negro); padding:0; font-size:calc(var(--t) * .4); font-weight:900; }
  .rombo .u { grid-area:1/2; } .rombo .l { grid-area:2/1; }
  .rombo .r { grid-area:2/3; } .rombo .d { grid-area:3/2; }
  .rombo .oro { background:var(--oro2); color:var(--negro); }
  .rombo .neg { background:var(--negro); color:var(--oro2); }

  /* Centro */
  .centro { display:flex; flex-direction:column; align-items:center; gap:14px; }
  .estado { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:800;
            background:var(--blanco); border:3px solid var(--negro); border-radius:999px; padding:4px 12px; }
  #led { width:11px; height:11px; border-radius:50%; background:#e03a3a; border:2px solid var(--negro); }
  #led.on { background:var(--verde); }
  .pill { background:var(--blanco); color:var(--negro); border:3px solid var(--negro);
          border-radius:999px; padding:9px 16px; font-size:12px; font-weight:900; letter-spacing:1px;
          transform:rotate(-18deg); font-family:inherit; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.55); }
  .pill:active, .pill.activo { transform:rotate(-18deg) translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.55); }

  #log { font-size:12px; min-height:16px; text-align:center; color:#6b5a2a; }
  .atajos { font-size:11px; color:#8a7740; text-align:center; max-width:520px; }

  /* Celular en vertical */
  @media (max-width:560px) {
    :root { --t:clamp(38px, 11.4vw, 56px); }
    .cuerpo { grid-template-columns:1fr 1fr; border-radius:48px; padding:44px 14px 22px; row-gap:18px; }
    .der { grid-area:1/2; }
    .centro { grid-area:2/1/3/3; flex-direction:row; flex-wrap:wrap; justify-content:center; }
  }
  /* Celular en horizontal */
  @media (orientation:landscape) and (max-height:520px) and (min-width:561px) {
    body { flex-direction:row; flex-wrap:wrap; justify-content:center; align-items:center; gap:10px 18px; }
    h1 { flex-basis:100%; }
    .vista { width:36vw; } .control { width:56vw; }
    :root { --t:clamp(30px, 9vh, 44px); }
    .cuerpo { padding:38px 16px 18px; border-radius:50px; }
    .atajos { display:none; }
  }
</style>
</head>
<body>
  <h1>🦾 CONTROL DE LA <span>GARRA</span></h1>

  <div class="vista">
    <div class="pantalla">
      <svg viewBox="0 0 400 260" role="img" aria-label="Simulación de la garra">
        <defs>
          <pattern id="rej" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M20 0H0V20" fill="none" stroke="#e0a82e" stroke-opacity=".25"/>
          </pattern>
        </defs>
        <rect width="400" height="260" fill="url(#rej)"/>
        <text x="388" y="22" text-anchor="end" font-size="11" font-family="monospace"
              letter-spacing="2" fill="#8a7740">SIMULACIÓN</text>

        <!-- Dial de la base -->
        <g transform="translate(52,64)">
          <circle r="34" fill="#fffdf6" stroke="#141414" stroke-width="4"/>
          <text y="-42" text-anchor="middle" font-size="10" font-weight="700" fill="#141414">BASE</text>
          <g id="aguja">
            <line y2="-26" stroke="#141414" stroke-width="7" stroke-linecap="round"/>
            <line y2="-26" stroke="#f7cf5a" stroke-width="3" stroke-linecap="round"/>
          </g>
          <circle r="5" fill="#e0a82e" stroke="#141414" stroke-width="3"/>
        </g>

        <!-- Suelo y pedestal -->
        <line x1="20" y1="238" x2="380" y2="238" stroke="#141414" stroke-width="4" stroke-linecap="round"/>
        <rect x="150" y="190" width="40" height="28" rx="6" fill="#fffdf6" stroke="#141414" stroke-width="4"/>
        <rect x="120" y="214" width="100" height="24" rx="8" fill="#e0a82e" stroke="#141414" stroke-width="4"/>

        <!-- Brazo -->
        <g id="g1" transform="translate(170,198) rotate(20)">
          <rect x="-10" y="-75" width="20" height="75" rx="10" fill="#fffdf6" stroke="#141414" stroke-width="4"/>
          <g id="g2" transform="translate(0,-75) rotate(20)">
            <rect x="-8" y="-70" width="16" height="70" rx="8" fill="#f7cf5a" stroke="#141414" stroke-width="4"/>
            <g id="g3" transform="translate(0,-70)">
              <g id="dedoI" transform="translate(-9,-12) rotate(-11)">
                <rect x="-4" y="-36" width="8" height="36" rx="4" fill="#141414"/>
              </g>
              <g id="dedoD" transform="translate(9,-12) rotate(11)">
                <rect x="-4" y="-36" width="8" height="36" rx="4" fill="#141414"/>
              </g>
              <rect x="-14" y="-14" width="28" height="16" rx="5" fill="#fffdf6" stroke="#141414" stroke-width="4"/>
              <circle r="6" fill="#e0a82e" stroke="#141414" stroke-width="3"/>
            </g>
            <circle r="9" fill="#e0a82e" stroke="#141414" stroke-width="4"/>
          </g>
          <circle r="12" fill="#e0a82e" stroke="#141414" stroke-width="4"/>
        </g>
      </svg>
    </div>
    <div class="datos">
      <span id="dB"></span><span id="dH"></span><span id="dC"></span>
      <span id="dM"></span><span id="dP"></span>
    </div>
  </div>

  <div class="control">
    <button class="tecla gatillo l" data-c="o" disabled>✋ ABRIR</button>
    <button class="tecla gatillo r" data-c="c" disabled>✊ CERRAR</button>

    <div class="cuerpo">
      <div class="izq">
        <div class="aro">
          <div class="cruz">
            <button class="tecla u" data-c="w" disabled>▲</button>
            <button class="tecla l" data-c="a" disabled>◀</button>
            <div class="mid"></div>
            <button class="tecla r" data-c="d" disabled>▶</button>
            <button class="tecla d" data-c="s" disabled>▼</button>
          </div>
        </div>
        <span class="etq">BASE · HOMBRO</span>
      </div>

      <div class="centro">
        <div class="estado"><span id="led"></span><span id="txt">Desconectado</span></div>
        <button class="pill" id="conectar">CONECTAR</button>
        <button class="tecla pill" data-c="1" disabled>🏠 REPOSO</button>
      </div>

      <div class="der">
        <div class="aro">
          <div class="rombo">
            <button class="tecla u oro" data-c="i" disabled>▲</button>
            <button class="tecla l neg" data-c="j" disabled>◀</button>
            <button class="tecla r neg" data-c="l" disabled>▶</button>
            <button class="tecla d oro" data-c="k" disabled>▼</button>
          </div>
        </div>
        <span class="etq">CODO · MUÑECA</span>
      </div>
    </div>
  </div>

  <div id="log"></div>
  <div class="atajos">Teclado: W A S D base/hombro · Flechas codo/muñeca · Q abrir · E cerrar · Espacio reposo</div>

<script>
  /* ---------- Bluetooth ---------- */
  const SERVICIO = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
  const RX       = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
  let dispositivo = null, rx = null, repetidor = null, ocupado = false;

  const led = document.getElementById('led');
  const txt = document.getElementById('txt');
  const log = document.getElementById('log');
  const teclas = document.querySelectorAll('.tecla');

  function estado(conectado) {
    led.classList.toggle('on', conectado);
    txt.textContent = conectado ? 'Conectado' : 'Desconectado';
    teclas.forEach(t => t.disabled = !conectado);
    if (!conectado) { rx = null; detener(); }
  }

  async function conectar() {
    if (!navigator.bluetooth) {
      alert('Usa Chrome o Edge (laptop y Android). En iPhone usa la app Bluefy.');
      return;
    }
    try {
      dispositivo = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICIO] }] });
      dispositivo.addEventListener('gattserverdisconnected', () => estado(false));
      const servidor = await dispositivo.gatt.connect();
      const servicio = await servidor.getPrimaryService(SERVICIO);
      rx = await servicio.getCharacteristic(RX);
      estado(true);
      log.textContent = '';
    } catch (e) {
      log.textContent = 'No se pudo conectar: ' + e.message;
    }
  }

  async function enviar(c) {
    if (!rx || ocupado) return;
    ocupado = true;
    try {
      await rx.writeValueWithoutResponse(new TextEncoder().encode(c));
      simular(c);
      log.textContent = 'Enviado: ' + c;
    } catch (e) {
      log.textContent = 'Error: ' + e.message;
      estado(false);
    } finally {
      ocupado = false;
    }
  }

  /* ---------- Simulación de la garra ---------- */
  const PASO = 5;
  const LIM = { b:[0,180], h:[75,165], c:[0,180], m:[0,180], p:[10,120] };
  const meta  = { b:90, h:110, c:90, m:90, p:45 };
  const vista = { ...meta };
  const acotar = (k, v) => Math.min(LIM[k][1], Math.max(LIM[k][0], v));

  const MOV = { a:['b',-PASO], d:['b',PASO], w:['h',PASO], s:['h',-PASO],
                i:['c',PASO],  k:['c',-PASO], j:['m',-PASO], l:['m',PASO],
                o:['p',PASO],  c:['p',-PASO] };

  function simular(cmd) {
    if (cmd === '1') { meta.b = 90; meta.h = 110; meta.c = 90; meta.m = 90; return; }
    if (cmd === '2') { meta.h = 150; return; }
    if (cmd === '3') { meta.b = 45; return; }
    if (cmd === '4') { meta.b = 135; return; }
    const m = MOV[cmd];
    if (m) meta[m[0]] = acotar(m[0], meta[m[0]] + m[1]);
  }

  const $ = id => document.getElementById(id);
  const g1 = $('g1'), g2 = $('g2'), g3 = $('g3'), dedoI = $('dedoI'), dedoD = $('dedoD'), aguja = $('aguja');

  function dibujar() {
    for (const k in meta) vista[k] += (meta[k] - vista[k]) * 0.12;
    g1.setAttribute('transform', `translate(170,198) rotate(${130 - vista.h})`);
    g2.setAttribute('transform', `translate(0,-75) rotate(${vista.c - 70})`);
    g3.setAttribute('transform', `translate(0,-70) rotate(${(vista.m - 90) * 0.5})`);
    const abre = 4 + (vista.p - 10) * 0.2;
    dedoI.setAttribute('transform', `translate(-9,-12) rotate(${-abre})`);
    dedoD.setAttribute('transform', `translate(9,-12) rotate(${abre})`);
    aguja.setAttribute('transform', `rotate(${vista.b - 90})`);
    $('dB').textContent = 'Base ' + Math.round(meta.b) + '°';
    $('dH').textContent = 'Hombro ' + Math.round(meta.h) + '°';
    $('dC').textContent = 'Codo ' + Math.round(meta.c) + '°';
    $('dM').textContent = 'Muñeca ' + Math.round(meta.m) + '°';
    $('dP').textContent = 'Pinza ' + Math.round(meta.p) + '°';
    requestAnimationFrame(dibujar);
  }
  dibujar();

  /* ---------- Botones ---------- */
  function iniciar(c, boton) {
    detener();
    boton.classList.add('activo');
    if (navigator.vibrate) navigator.vibrate(20);
    enviar(c);
    if (c !== '1') repetidor = setInterval(() => enviar(c), 130);
  }
  function detener() {
    clearInterval(repetidor);
    repetidor = null;
    teclas.forEach(t => t.classList.remove('activo'));
  }

  $('conectar').addEventListener('click', conectar);

  teclas.forEach(t => {
    t.addEventListener('pointerdown', e => { e.preventDefault(); iniciar(t.dataset.c, t); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => t.addEventListener(ev, detener));
    t.addEventListener('contextmenu', e => e.preventDefault());
  });

  /* ---------- Teclado (laptop) ---------- */
  const mapa = { w:'w', a:'a', s:'s', d:'d',
                 arrowup:'i', arrowdown:'k', arrowleft:'j', arrowright:'l',
                 q:'o', e:'c', ' ':'1', r:'1', enter:'1' };
  document.addEventListener('keydown', e => {
    const c = mapa[e.key.toLowerCase()];
    if (!c || e.repeat) return;
    e.preventDefault();
    const b = document.querySelector(`.tecla[data-c="${c}"]`);
    if (b && !b.disabled) iniciar(c, b);
  });
  document.addEventListener('keyup', detener);
</script>
</body>
</html>
